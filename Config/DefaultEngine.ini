[SystemSettings]
; Volumetric fog grid: fine enough that moonlight shafts and the torch beam keep their edges
; (8 cost ~2 ms more outdoors for little visible gain in fog this thick).
r.VolumetricFog.GridPixelSize=10
r.VolumetricFog.GridSizeZ=128
r.LocalFogVolume.RenderIntoVolumetricFog=1
; Outdoor cost, measured on the manor grounds (Scripts/playtest_grounds.py, NOIR_EXP):
; local lights' shadows (the torch moves every frame, so its shadow redraws every frame) a
; resolution step coarser: -3.7 ms; the beam is soft anyway.
r.Shadow.Virtual.ResolutionLodBiasLocal=2
; Candles, lanterns and the torch overlap; without room for them some shadows are dropped.
r.Shadow.Virtual.OnePassProjection.MaxLightsPerPixel=16
; Lumen on the global distance field only: -1.9 ms; the fog hides the finer detail.
r.Lumen.TraceMeshSDFs=0
; Reflections at half resolution rather than off: the wet cobbles need them.
r.Lumen.Reflections.DownsampleFactor=2
; Nanite a little coarser (the forest's needles): -1.2 ms.
r.Nanite.MaxPixelsPerEdge=2

